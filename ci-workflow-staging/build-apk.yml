name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Assemble debug APK
        id: assemble
        run: gradle assembleDebug --stacktrace 2>&1 | tee /tmp/build-full.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to dist branch
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/app-debug.apk app-debug.apk
          git add app-debug.apk
          git commit -m "APK build from $GITHUB_SHA"
          git branch -M dist
          git push --force origin dist

      - name: Publish error log to dist branch
        if: failure()
        run: |
          tail -c 200000 /tmp/build-full.log > /tmp/build-error.log || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/build-error.log build-error.log
          git add build-error.log
          git commit -m "Build failure log from $GITHUB_SHA"
          git branch -M dist
          git push --force origin dist
